name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms matter: ARP output is parsed from `arp -an` on macOS
        # and `ip neigh` on Linux, and the two formats differ.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check netdiff tests
      - run: ruff format --check netdiff tests

  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: the package must declare no runtime dependencies
        run: |
          deps=$(pip show netdiff | awk -F': ' '/^Requires:/ {print $2}')
          test -z "$deps" || { echo "unexpected runtime deps: $deps"; exit 1; }
      - run: netdiff --help
